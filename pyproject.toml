[project]
name = "fauna-codex"
version = "0.3.0"
description = "Mechanical + optional semantic code-symbol atlas for any repository."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
local = ["fastembed>=0.5"]
treesitter = ["tree-sitter>=0.22", "tree-sitter-javascript>=0.21", "tree-sitter-typescript>=0.21", "tree-sitter-go>=0.25", "tree-sitter-rust>=0.24"]

[project.scripts]
fauna-codex = "fauna_codex.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["fauna_codex*"]
